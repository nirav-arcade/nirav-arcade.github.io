// ---------- layout ----------
const HUD=56;
let corX,corW,roomW,rowH,mapH,PLY=-1;
function layout(){
 mapH=H-HUD;
 corW=Math.max(50,Math.min(70,W*.17));
 corX=(W-corW)/2;
 roomW=(W-corW)/2;
 rowH=mapH/5;
}
// rooms: i = side*5 + row ; side 0 = left, 1 = right
function roomRect(i){
 const s=(i>=5)?1:0,r=i%5;
 return{x:s?corX+corW:0,y:HUD+r*rowH,w:roomW,h:rowH,side:s,row:r};
}
function doorPos(rm){
 const r=roomRect(rm);
 // The opening sits directly on the corridor/room boundary and is wide enough for the ghost to pass.
 const x=r.side?corX+corW:corX-22;
 return{x:x,y:r.y+r.h/2-23,w:22,h:46,cx:x+11,cy:r.y+r.h/2};
}
function bedPos(rm){
 const r=roomRect(rm);
 const bw=Math.min(64,r.w*.42),bh=Math.min(46,r.h*.4);
 const x=r.side?r.x+r.w-bw-8:r.x+8;
 return{x:x,y:r.y+r.h-bh-8,w:bw,h:bh,cx:x+bw/2,cy:r.y+r.h-bh/2-8};
}
function turretPos(rm,k){
 const r=roomRect(rm);
 const bp=bedPos(rm);
 const xs=r.side?[r.x+r.w-30,r.x+r.w-58,r.x+34]:[r.x+30,r.x+58,r.x+r.w-34];
 const ys=k===2?r.y+26:(k===0?r.y+r.h*.42:r.y+r.h*.62);
 return{x:xs[k],y:ys};
}

function beep(f,d,type,v,slide){if(!ensureAudio())return;try{const o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),now+d);g.gain.setValueAtTime(v||.05,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d+.01)}catch(e){}}
function startAmbience(){if(!ensureAudio()||ambience)return;try{const now=AC.currentTime,master=AC.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.018,now+1.8);master.connect(AC.destination);ambienceNodes=[master];for(const [freq,vol,wave] of [[55,.55,'sine'],[82.4,.28,'triangle'],[110,.12,'sine']]){const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(master);o.start(now);ambienceNodes.push(o,g)}ambience=master}catch(e){ambience=null;ambienceNodes=[]}}

 else a.path=[{x:center,y:dp.cy},{x:cp.x,y:cp.y},{x:dp.cx,y:dp.cy},{x:ip.x,y:ip.y},{x:bp.cx,y:bp.cy}];
}
function freeRoom(exclude,exceptAI){return G.rooms.find(r=>r.i!==exclude&&!r.occupied&&!G.aiRunners.some(a=>a.id!==exceptAI&&!a.done&&a.dest===r.i))||null}
function rerouteAIForPlayer(idx){
 const a=G.aiRunners.find(q=>q.dest===idx&&q.id!==-1);if(!a)return;
 const free=freeRoom(idx,a.id);if(!free)return;
 if(a.done&&a.room===idx){
  const fromRoom=a.room,src=G.rooms[idx],dst=free;
  for(const k of ['name','door','bedLv','coins','turrets','smart','actT','sleepPh','gone'])dst[k]=src[k];
  dst.occupied=false;dst.aiId=a.id;const bp=bedPos(idx);a.x=bp.cx;a.y=bp.cy;a.room=fromRoom;src.aiId=null;routeAI(a,dst.i,a.x,a.y,true);return;
 }
 routeAI(a,free.i,a.x,a.y,false);
}
function settleAI(a){const r=G.rooms[a.dest];r.occupied=true;r.name=a.name;r.aiId=a.id;r.isPlayer=false;a.done=true;a.room=r.i;a.x=bedPos(r.i).cx;a.y=bedPos(r.i).cy}
function updateAIRunners(dt){if(!G||!G.aiRunners)return;for(const a of G.aiRunners){if(a.done)continue;const p=a.path[a.step];if(!p){settleAI(a);continue}const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),step=96*dt;a.walk+=dt*10;if(d<=step+1){a.x=p.x;a.y=p.y;a.step++;if(a.step>=a.path.length)settleAI(a)}else{a.x+=dx/d*step;a.y+=dy/d*step}}}

 if(PLY<0){const empty=G.rooms.find(r=>!r.occupied),idx=empty?empty.i:G.emptyIndex,rm=G.rooms[idx],cp=corridorDoorPoint(rm),ip=insideDoorPoint(rm);G.runner.autoRoom=idx;G.runner.path=[cp,ip];G.runner.pathIndex=0;state='autoenter';return}
 state='play';G.phaseTimer=0;G.lastPlyAtk=-99;startAmbience();
 G.ghost.mode='spawn';G.ghost.x=W/2;G.ghost.y=-40;G.ghost.target=-1;G.ghost.lastTarget=-1;
 G.lvTimer=50;say('Defense shuru! Bhoot tumhare peeche aayega!','#ffbd5b');
}
function claimRoom(idx,automatic=false){
 if(PLY>=0||idx<0||idx>=10)return;
 const target=G.rooms[idx],vacancy=G.rooms.find(r=>!r.occupied);
 if(!target||!target.alive)return;
 rerouteAIForPlayer(idx);
 if(target.occupied&&vacancy&&vacancy!==target){
  for(const k of ['name','alive','door','bedLv','coins','turrets','smart','actT','sleepPh','gone'])vacancy[k]=target[k];
  vacancy.occupied=false;vacancy.isPlayer=false;
 }
 target.occupied=true;target.alive=true;target.isPlayer=true;target.name='NIRAV';
 target.coins=Math.max(120,G.runner.coins);target.door={lv:1,hp:DOORHP[0],max:DOORHP[0]};target.bedLv=1;target.turrets=[null,null,null];
 target.smart=1;target.actT=0;target.gone=0;PLY=idx;G.emptyIndex=vacancy&&vacancy!==target?vacancy.i:-1;
 const bp=bedPos(idx);G.runner.fromX=G.runner.x;G.runner.fromY=G.runner.y;G.runner.toX=bp.cx;G.runner.toY=bp.cy;G.runner.settleT=0;
 state='settle';stick={x:0,y:0};movePointer=null;
 say(automatic?'Room mil gaya - defense shuru!':'NIRAV andar aa gaya - room set ho raha hai!','#ffe36e');

function roomForPoint(x,y){
 if(x>=corX&&x<=corX+corW)return -1;
 const row=Math.max(0,Math.min(4,Math.floor((y-HUD)/rowH)));
 return (x>corX+corW?5:0)+row;
}
function moveRunner(dt){
 if(!G)return;
 if(state==='autoenter'){const p=G.runner,path=p.path||[],goal=path[p.pathIndex];if(goal){const dx=goal.x-p.x,dy=goal.y-p.y,d=Math.hypot(dx,dy),step=105*dt;p.walk+=dt*10;if(d<=step+1){p.x=goal.x;p.y=goal.y;p.pathIndex++;if(p.pathIndex>=path.length)claimRoom(p.autoRoom,true)}else{p.x+=dx/d*step;p.y+=dy/d*step}}for(const rm of G.rooms)if(rm.occupied&&!rm.isPlayer)aiTick(rm,dt);return}
 if(state!=='move')return;
 let dx=stick.x,dy=stick.y;
 if(moveKeys.left)dx-=1;if(moveKeys.right)dx+=1;if(moveKeys.up)dy-=1;if(moveKeys.down)dy+=1;
 const mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}
 const p=G.runner,spd=112;
 if(mag>.08){p.walk+=dt*10;const nx=Math.max(PLAYER_R,Math.min(W-PLAYER_R,p.x+dx*spd*dt));let allowX=true;
  const left=corX,right=corX+corW,row=Math.max(0,Math.min(4,Math.floor((p.y-HUD)/rowH))),gateY=HUD+rowH*(row+.5),gate=Math.abs(p.y-gateY)<=22-PLAYER_R;
  const inCorr=p.x>=left-PLAYER_R&&p.x<=right+PLAYER_R;
  if(inCorr&&nx<left+PLAYER_R&&!gate)allowX=false;
  if(inCorr&&nx>right-PLAYER_R&&!gate)allowX=false;
  if(!inCorr){const side=p.x<left?-1:1,bound=side<0?left:right;
   if(side<0&&nx>bound-PLAYER_R&&!gate)allowX=false;
   if(side>0&&nx<bound+PLAYER_R&&!gate)allowX=false;
  }
  if(allowX)p.x=nx;
  let ny=p.y+dy*spd*dt;const zone=roomForPoint(p.x,p.y);
  if(zone<0)ny=Math.max(HUD+PLAYER_R,Math.min(H-PLAYER_R,ny));
  else{const rr=roomRect(zone);ny=Math.max(rr.y+PLAYER_R,Math.min(rr.y+rr.h-PLAYER_R,ny));
   const minX=rr.side?corX+corW+PLAYER_R:PLAYER_R,maxX=rr.side?W-PLAYER_R:corX-PLAYER_R;
   p.x=Math.max(minX,Math.min(maxX,p.x));}
  p.y=ny;
  const idx=roomForPoint(p.x,p.y);if(idx>=0)claimRoom(idx,false);
 }else p.walk*=.85;
 G.runner.coins+=2*dt;
 G.phaseTimer-=dt;
 for(const rm of G.rooms)if(rm.occupied&&!rm.isPlayer)aiTick(rm,dt);
 updateAIRunners(dt);
 if(G.phaseTimer<=0&&state==='move')startDefense();
}

function aliveRooms(){return G.rooms.filter(r=>r.alive&&r.occupied)}
function player(){return PLY>=0?G.rooms[PLY]:null}
function turDmg(t){return TURLV[t.lv-1].dmg}

// ---------- economy / actions (shared shape for player + AI) ----------
function income(rm){return BEDINC[rm.bedLv-1]}
function canPay(rm,c){return rm.coins>=c}
function pay(rm,c){if(rm.coins<c)return false;rm.coins-=c;return true}
function upgBed(rm){
 const c=BEDCOST[rm.bedLv-1];if(c===undefined||!pay(rm,c))return false;
 rm.bedLv++;return true;
}
function upgDoor(rm){
 const c=DOORCOST[rm.door.lv-1];if(c===undefined||!pay(rm,c))return false;
 rm.door.lv++;rm.door.max=DOORHP[rm.door.lv-1];rm.door.hp=rm.door.max;return true;
}
function buildTur(rm,k){
 if(rm.turrets[k])return false;
 if(!pay(rm,TURLV[0].cost))return false;
 rm.turrets[k]={lv:1,cd:0,kick:0};return true;
}
function upgTur(rm,k){
 const t=rm.turrets[k];if(!t)return false;
 const nx=TURLV[t.lv];if(!nx||nx.cost===undefined)return false;
 if(!pay(rm,nx.cost))return false;
 t.lv++;return true;
}
// player wrappers with feedback
function ownAct(fn,okMsg){
 const rm=player();if(!rm.alive)return;
 if(fn(rm)){beep(520,.15,'sine',.07);const r=roomRect(PLY);ftext(r.x+r.w/2,r.y+18,okMsg,'#9dffb0')}
 else{beep(120,.15,'square',.05);ftext(W/2,H*.5,'Coins kam hain!','#ff8f8f')}
}

// ---------- AI ----------
function aiTick(rm,dt){
 if(!rm.occupied||rm.isPlayer)return;
 rm.coins+=income(rm)*dt;
 rm.actT-=dt;
 if(rm.actT>0)return;
 rm.actT=rnd(.9,1.8);
 if(Math.random()>rm.smart)return; // dumb AIs hesitate
 const gh=G.ghost;
 const threatened=(gh.target===rm.i&&(gh.mode==='attack'||gh.mode==='travel'))||rm.door.hp<rm.door.max*.55;
 // priorities
 if(!rm.turrets[0]){buildTur(rm,0);return}
 if(rm.bedLv<2){upgBed(rm);return}
 if(!rm.turrets[1]){buildTur(rm,1);return}
 if(threatened&&rm.door.lv<5&&rm.door.lv<rm.bedLv+2){if(upgDoor(rm))return}
 if(rm.bedLv<3&&rm.smart>.5){upgBed(rm);return}
 if(!rm.turrets[2]&&rm.smart>.45){buildTur(rm,2);return}
 if(threatened&&rm.door.lv<5){if(upgDoor(rm))return}
 // upgrade turrets
 const tu=rm.turrets.map((t,k)=>t?{t,k}:null).filter(Boolean).sort((a,b)=>a.t.lv-b.t.lv)[0];
 if(tu&&tu.t.lv<(rm.smart>.75?4:2)){if(upgTur(rm,tu.k))return}
 if(rm.bedLv<4&&rm.smart>.7){upgBed(rm);return}
 if(rm.door.lv<3){upgDoor(rm)}
}

// ---------- ghost ----------
// Every route between corridor and room passes through the broken doorway.
function corridorDoorPoint(rm){
 const dp=doorPos(rm.i);
 return{x:rm.i>=5?corX+corW-18:corX+18,y:dp.cy};
}
function insideDoorPoint(rm){
 const dp=doorPos(rm.i),dir=rm.i>=5?1:-1;
 return{x:dp.cx+dir*(dp.w/2+14),y:dp.cy};
}
function moveGhostTo(x,y,speed,dt){
 const gh=G.ghost,dx=x-gh.x,dy=y-gh.y,d=Math.hypot(dx,dy);
 const step=speed*dt;
 if(d<=step+1){gh.x=x;gh.y=y;return true}
 gh.x+=dx/d*step;gh.y+=dy/d*step;return false;
}
function setAtk(rm){
 const gh=G.ghost,cp=corridorDoorPoint(rm);
 gh.target=rm.i;gh.lastTarget=rm.i;
 gh.ax=cp.x;gh.ay=cp.y; // approach and attack from inside the corridor
 gh.mode='travel';
 if(rm.isPlayer){G.lastPlyAtk=G.t;say('BHOOT TUMHARE ROOM KI TARAF!','#ff5d78');beep(140,.5,'sawtooth',.08,.5)}
}
function pickTarget(){
 const gh=G.ghost,alive=aliveRooms();if(!alive.length)return;
 const pm=player();
 // the ghost comes for YOU regularly - first target is always the player, then at least every ~30s
 if(pm&&pm.alive&&G.t-G.lastPlyAtk>40){setAtk(pm);return}
 let bestRm=null,bestSc=1e9;
 for(const rm of alive){
  if(rm.isPlayer&&gh.lastTarget===PLY)continue; // just hit you - give you a breather, hit someone else
  let sc=rm.door.hp+rnd(0,140);
  const tdps=rm.turrets.filter(Boolean).reduce((s,t)=>s+turDmg(t),0);
  sc+=tdps*22;
  if(rm.isPlayer)sc-=70;
  if(sc<bestSc){bestSc=sc;bestRm=rm}
 }
 if(!bestRm)bestRm=pm.alive?pm:alive[0];
 setAtk(bestRm);
}
function hurtGhost(d,silent){
 const gh=G.ghost;if(state!=='play')return;
 gh.hp-=d;G.dmgDone+=d;if(!silent)gh.fl=.08;
 if(gh.hp<=0){gh.hp=0;finish(true)}
}
function updateGhost(dt){
 const gh=G.ghost,gl=GLV[gh.lv];
 gh.ph+=dt*4;if(gh.fl>0)gh.fl-=dt;
 G.lvTimer-=dt;if(G.lvTimer<=0){G.lvTimer=50;lvlUp()}
 switch(gh.mode){
  case 'spawn':{
   gh.y+=(HUD+mapH*.5-gh.y)*Math.min(1,dt*.9);
   if(gh.y>HUD+mapH*.4){gh.mode='roam';gh.rt=3.5;gh.ty=HUD+rnd(mapH*.2,mapH*.8)}
   break}
  case 'roam':{
   gh.rt-=dt;
   gh.y+=Math.sign(gh.ty-gh.y)*gl.spd*dt;
   if(Math.abs(gh.ty-gh.y)<8){gh.ty=HUD+rnd(mapH*.08,mapH*.92)}
   if(gh.rt<=0){gh.x+=(W/2-gh.x)*Math.min(1,dt*6);pickTarget()}
   break}
  case 'travel':{
   const dx=gh.ax-gh.x,dy=gh.ay-gh.y,d=Math.hypot(dx,dy);
   if(d<6){gh.mode='attack';gh.att=0;gh.holdT=0;if(gh.target===PLY)G.lastPlyAtk=G.t;break}
   gh.x+=dx/d*gl.spd*1.4*dt;gh.y+=dy/d*gl.spd*1.4*dt;
   break}
  case 'attack':{
   const rm=G.rooms[gh.target];
   if(!rm||!rm.alive){gh.mode='roam';gh.rt=1;break}
   if(rm.door.hp<=0){
    gh.mode='enter';gh.eStage=0;
    const dp=doorPos(rm.i),ip=insideDoorPoint(rm);
    const bp=bedPos(rm.i);
    gh.enterRoute=[{x:dp.cx,y:dp.cy},ip,{x:bp.cx,y:bp.cy}];
    say(rm.isPlayer?'TUMHARA DOOR TUT GAYA!':rm.name+' KA DOOR TUT GAYA!','#ff3b30');
    beep(60,.6,'sawtooth',.09,.3);G.shake=Math.max(G.shake,9);
    break}
   let dps=gl.dmg;
   if(rm.door.hp/rm.door.max<.3)dps*=1.35;
   rm.door.hp=Math.max(0,rm.door.hp-dps*dt);
   G.shake=Math.max(G.shake,1.4);
   gh.att+=dt;
   const dp=doorPos(rm.i);
   if(gh.att>.5){gh.att=0;if(rm.isPlayer)beep(78,.13,'triangle',.055,.58);else beep(90,.09,'square',.025);
    parts.push({x:dp.cx+rnd(-10,10),y:dp.cy+rnd(-16,16),vx:rnd(-30,30),vy:rnd(-60,-10),life:.5,c:'#c9a24a',s:3})}
   if(gh.hp<gh.max*.20&&gh.regenCd<=0){gh.mode='flee';gh.fy=HUD+20;say('Bhoot bhaag raha hai!','#9dffb0')}
   // gives up on a door that holds too long - moves to the next room like the real game
   gh.holdT+=dt;
   if(gh.holdT>22){say(rm.isPlayer?'Bhoot haar ke chala gaya... abhi wapas aayega!':'Bhoot doosre room ki taraf gaya','#9ad7ff');gh.mode='roam';gh.rt=.8;gh.ty=gh.y+rnd(-60,60)}
   break}
  case 'enter':{
   const p=gh.enterRoute&&gh.enterRoute[gh.eStage];
   if(!p){eliminate(gh.target);break}
   if(moveGhostTo(p.x,p.y,gh.eStage<2?70:78,dt)){
    gh.eStage++;
    if(gh.eStage>=gh.enterRoute.length)eliminate(gh.target);
   }
   break}
  case 'exit':{
   const p=gh.exitRoute&&gh.exitRoute[gh.exitStage];
   if(!p){finishGhostExit();break}
   if(moveGhostTo(p.x,p.y,78,dt)){
    gh.exitStage++;
    if(gh.exitStage>=gh.exitRoute.length)finishGhostExit();
   }
   break}
  case 'flee':{
   gh.y-=gl.spd*2*dt;
   if(gh.y<=gh.fy){gh.mode='regen';gh.rt=0}
   break}
  case 'regen':{
   gh.hp=Math.min(gh.max*.55,gh.hp+gh.max*.05*dt);gh.rt+=dt;
   if(gh.rt>3||gh.hp>=gh.max*.55){gh.regenCd=24;say('Bhoot wapas aa gaya!','#ff8fa0');pickTarget()}
   break}
 }
 if(gh.regenCd>0)gh.regenCd-=dt;
}
function eliminate(idx){
 const rm=G.rooms[idx];if(!rm||!rm.alive)return;
 rm.alive=false;rm.gone=G.t;G.aliveCount--;
 const gh=G.ghost,dp=doorPos(idx),ip=insideDoorPoint(rm),cp=corridorDoorPoint(rm);
 gh.hp=Math.min(gh.max,gh.hp+gh.max*.35);
 gh.exitPlayer=rm.isPlayer;
 gh.exitStage=0;
 gh.exitRoute=[ip,{x:dp.cx,y:dp.cy},cp];
 gh.mode='exit';gh.target=idx;
 const r=roomRect(idx);
 for(let i=0;i<14;i++)parts.push({x:r.x+r.w/2,y:r.y+r.h/2,vx:rnd(-90,90),vy:rnd(-120,20),life:rnd(.4,.9),c:'#b08cff',s:ri(2,4)});
 beep(48,.9,'sawtooth',.09,.35);G.shake=12;
 say(rm.isPlayer?'TUMHE PAKAD LIYA!':rm.name+' PAKDA GAYA!  '+G.aliveCount+' bache','#ff8fa0');
}
function finishGhostExit(){
 const gh=G.ghost,wasPlayer=gh.exitPlayer;
 gh.mode='roam';gh.rt=1.1;gh.ty=HUD+rnd(mapH*.1,mapH*.9);gh.target=-1;
 gh.exitRoute=null;gh.enterRoute=null;gh.exitPlayer=false;
 if(wasPlayer)finish(false);
}
function lvlUp(){
 const gh=G.ghost;gh.lv=Math.min(14,gh.lv+1);
 gh.max=GLV[gh.lv].hp;gh.hp=Math.min(gh.max,gh.hp+gh.max*.6);

// ---------- update ----------
function update(dt){
 G.t+=dt;
 if(state==='move'||state==='autoenter'){moveRunner(dt);return}
 if(state==='settle'){
  updateAIRunners(dt);
  for(const rm of G.rooms)if(rm.occupied&&!rm.isPlayer)aiTick(rm,dt);
  const p=G.runner;p.settleT=Math.min(1,p.settleT+dt/SETTLE_TIME);const u=p.settleT*(2-p.settleT);p.x=p.fromX+(p.toX-p.fromX)*u;p.y=p.fromY+(p.toY-p.fromY)*u;
  if(p.settleT>=1)startDefense();return
 }
 updateAIRunners(dt);
 for(const rm of G.rooms){
  if(!rm.alive||!rm.occupied)continue;
  if(rm.isPlayer)rm.coins+=income(rm)*dt;
  else aiTick(rm,dt);
  // door slowly repairs itself while the ghost is not pounding it
  const underAttack=G.ghost.target===rm.i&&G.ghost.mode==='attack';
  if(!underAttack&&rm.door.hp>0&&rm.door.hp<rm.door.max)rm.door.hp=Math.min(rm.door.max,rm.door.hp+8*dt);
  // turrets fire
  for(let k=0;k<3;k++){
   const t=rm.turrets[k];if(!t)continue;
   t.cd-=dt;if(t.kick>0)t.kick-=dt;
   const gh=G.ghost;if(gh.mode==='spawn')continue;
   const tp=turretPos(rm.i,k);
   const R=rowH*1.6;
   if(Math.hypot(gh.x-tp.x,gh.y-tp.y)<R&&t.cd<=0){
    t.cd=.5;t.kick=.1;
    if(rm.isPlayer){
     const from=turretMuzzle(rm,k),to=ghostScreenPoint(gh),dx=to.x-from.x,dy=to.y-from.y,flight=.8;
     parts.push({x:from.x,y:from.y,tx:to.x,ty:to.y,vx:dx/flight,vy:dy/flight,life:flight,maxLife:flight,c:'#ffe88a',bullet:true,damage:TURLV[t.lv-1].dmg*.5,target:gh.target});
     parts.push({x:from.x,y:from.y,vx:0,vy:0,life:.11,c:'#fff0b2',muzzle:true});
     beep(620,.055,'square',.028,.55);
    }else hurtGhost(TURLV[t.lv-1].dmg*.5);
   }
  }
 }
 updateGhost(dt);updateSound(dt);
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.life<=0){
   if(p.bullet){
    if(state==='play'&&G.ghost.hp>0){
     hurtGhost(p.damage);G.ghost.fl=Math.max(G.ghost.fl,.24);
     parts.push({x:p.tx,y:p.ty,vx:0,vy:0,life:.38,maxLife:.38,c:'#fff2a8',impact:true});
     for(let n=0;n<8;n++){const a=n*Math.PI*2/8+Math.random()*.18,sp=42+Math.random()*54;parts.push({x:p.tx,y:p.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.34,maxLife:.34,c:n%2?'#fff3a1':'#c8f6ff',spark:true,s:3+Math.random()*2.5})}
    }
   }
   parts.splice(i,1);
  }
 }
 for(let i=texts.length-1;i>=0;i--){texts[i].t-=dt;texts[i].y-=22*dt;if(texts[i].t<=0)texts.splice(i,1)}
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 G.shake*=.86;
}
function finish(win){
 state=win?'win':'lose';stopAmbience();
 if(win){beep(660,.4,'sine',.07);setTimeout(()=>beep(880,.5,'sine',.07),180);
  const sc=Math.round(G.t);if(!best||sc<best){best=sc;localStorage.setItem('nhd3_best',best)}}
 else{beep(55,1,'sawtooth',.09,.4)}
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bigText(txt,x,y,size,c1,c2){
 ctx.font='900 '+size+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*.14);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(txt,x,y);

 hpBar(W-96,13,86,9,G.ghost.hp/G.ghost.max,'#b06bff');ctx.fillStyle='#e6d6ff';ctx.font='700 9px system-ui';ctx.textAlign='right';ctx.fillText(state==='play'?'BHOOT':'START',W-10,38);
}

// ---------- shop (own-room upgrades / other-room inspection) ----------
let sheetBtns=[];
function openSheet(rm){sheet={rm}}
function shopButtonRect(){return{x:W-86,y:H-52,w:76,h:40}}
function drawShopButton(){
 if(state!=='play'||PLY<0||sheet)return;
 const b=shopButtonRect();btn('🛒 SHOP',b.x,b.y,b.w,b.h,'#be48ef','#6729a6',12);
}
function drawSheet(){
 if(!sheet)return;
 const rm=sheet.rm,shH=rm.isPlayer?244:150,y0=H-shH;
 ctx.fillStyle='rgba(10,8,24,.96)';ctx.fillRect(0,y0,W,shH);
 ctx.strokeStyle='rgba(255,213,74,.58)';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
 ctx.fillStyle=rm.isPlayer?'#ffd54a':'#cfc4ff';ctx.font='800 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText((rm.isPlayer?'SHOP · NIRAV ROOM':'ROOM: '+rm.name)+(rm.alive?'':'  (pakda gaya)'),W/2,y0+20);
 sheetBtns=[];
 if(!rm.alive){sheetBtns.push(btn('BAND KARO',W/2-70,y0+shH-52,140,38,'#3a3a55','#262640'));return}
 if(!rm.isPlayer){
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='600 12px system-ui';
  ctx.fillText('Bed Lv'+rm.bedLv+'  ·  Door Lv'+rm.door.lv+' ('+Math.ceil(rm.door.hp)+'/'+rm.door.max+' HP)',W/2,y0+48);
  const tl=rm.turrets.map(t=>t?'🔫Lv'+t.lv:'—').join('  ');
  ctx.fillText('Turrets: '+tl,W/2,y0+72);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 11px system-ui';
  ctx.fillText('(AI khel raha hai - sirf dekh sakte ho)',W/2,y0+94);
  sheetBtns.push(btn('BAND KARO',W/2-70,y0+shH-52,140,38,'#3a3a55','#262640'));
  return;
 }
 ctx.fillStyle='rgba(255,255,255,.82)';ctx.font='600 10px system-ui';
 ctx.fillText('Sote hue +'+income(rm)+' coins/s  ·  Door '+Math.ceil(rm.door.hp)+'/'+rm.door.max+' HP',W/2,y0+41);
 const bw=(W-32-24)/2,bh=44;
 const bc=BEDCOST[rm.bedLv-1],dc=DOORCOST[rm.door.lv-1];
 sheetBtns.push(btn('BED Lv'+(rm.bedLv+1),16,y0+56,bw,bh,'#2f6bd8','#1d3f8a',15,bc!==undefined?('💰'+bc+' · +'+BEDINC[rm.bedLv]+'/s'):'MAX',bc===undefined||rm.coins<bc));
 sheetBtns[sheetBtns.length-1].act='bed';
 sheetBtns.push(btn('DOOR Lv'+(rm.door.lv+1),16+bw+24,y0+56,bw,bh,'#8a5a2f','#5a3a1d',15,dc!==undefined?('💰'+dc+' · '+DOORHP[rm.door.lv]+' HP'):'MAX',dc===undefined||rm.coins<dc));
 sheetBtns[sheetBtns.length-1].act='door';
 const tw=(W-32-24)/3;
 for(let k=0;k<3;k++){
  const t=rm.turrets[k],next=t?TURLV[t.lv]:TURLV[0];
  const cost=next&&next.cost!==undefined?next.cost:1e9;
  const label=t?(next&&next.cost!==undefined?'🔫 SLOT '+(k+1)+' Lv'+(t.lv+1):'🔫 SLOT '+(k+1)+' MAX'):'🔫 BUILD '+(k+1);
  const sub=next&&next.cost!==undefined?('💰'+cost+' · '+next.dmg+' DPS'):(t?('Lv'+t.lv+' · '+TURLV[t.lv-1].dmg+' DPS'):'💰'+cost+' · '+TURLV[0].dmg+' DPS');
  sheetBtns.push(btn(label,16+k*(tw+12),y0+110,tw,46,'#1d7a8a','#0f4a55',11,sub,rm.coins<cost));
  sheetBtns[sheetBtns.length-1].act='tur'+k;
 }
 sheetBtns.push(btn('BAND KARO',W/2-70,y0+190,140,36,'#3a3a55','#262640'));
 sheetBtns[sheetBtns.length-1].act='close';
}
function sheetTap(x,y){
 for(const b of sheetBtns){
  if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
   const rm=sheet.rm;
   if(b.act==='close'||!rm.isPlayer){sheet=null;return true}
   if(b.act==='bed')ownAct(upgBed,'Bed Lv'+player().bedLv);
   else if(b.act==='door')ownAct(upgDoor,'Door Lv'+player().door.lv);
   else if(b.act&&b.act.indexOf('tur')===0){
    const k=+b.act.slice(3);
    if(rm.turrets[k])ownAct(m=>upgTur(m,k),'Turret Lv'+(rm.turrets[k]?rm.turrets[k].lv:1));
    else if(buildTur(rm,k)){beep(300,.12,'triangle',.06);ftext(W/2,y0OfSheet(),'Turret ready!','#9dffb0')}
    else{beep(120,.15,'square',.05);ftext(W/2,H*.5,'Coins kam hain!','#ff8f8f')}
   }
   return true;
  }
 }
 return false;
}
function y0OfSheet(){return H-244}

// ---------- title / end ----------
function drawTitle(){
 ctx.fillStyle='#080711';ctx.fillRect(0,0,W,H);
 // The supplied ghost photo sits behind the title, cropped cleanly and shaded for contrast.
 if(titleGhost.complete&&titleGhost.naturalWidth){
  const boxY=HUD+8,boxH=H*.43,scale=Math.max(W/titleGhost.naturalWidth,boxH/titleGhost.naturalHeight);
  const dw=titleGhost.naturalWidth*scale,dh=titleGhost.naturalHeight*scale;
  ctx.save();ctx.globalAlpha=.92;ctx.drawImage(titleGhost,(W-dw)/2,boxY+(boxH-dh)/2,dw,dh);ctx.restore();
  const shade=ctx.createLinearGradient(0,boxY,0,boxY+boxH);shade.addColorStop(0,'rgba(6,5,14,.32)');shade.addColorStop(.7,'rgba(6,5,14,.38)');shade.addColorStop(1,'rgba(6,5,14,.94)');ctx.fillStyle=shade;ctx.fillRect(0,boxY,W,boxH);
 }
 const t=performance.now()/1000;
 // subtle dorm windows below the face
 ctx.fillStyle='rgba(23,17,48,.72)';ctx.fillRect(W*.1,H*.34,W*.8,H*.3);
 for(let rr2=0;rr2<2;rr2++)for(let cc=0;cc<5;cc++){
  const wx=W*.1+W*.08+cc*W*.145,wy=H*.36+rr2*H*.13;
  ctx.fillStyle=Math.sin(t*2+rr2*3+cc)>-.2?'rgba(255,220,140,.55)':'rgba(120,110,160,.38)';
  ctx.fillRect(wx,wy,W*.075,H*.075);
 }
 bigText('NIRAV',W/2,H*.52,52,'#ffe36e','#ff9d3c');
 bigText('HAUNTED DORM',W/2,H*.52+48,34,'#c9b8ff','#7a5cff');
 ctx.fillStyle='#cfc4ff';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('Joystick se chalo, kisi bhi room mein ghuso',W/2,H*.68);
 playBtn=btn('▶  KHELO',W/2-90,H*.74,180,62,'#ff4d6d','#b3123a',24);
 if(best>0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 12px system-ui';ctx.fillText('best jeet: '+best+'s',W/2,H*.88)}
}
let playBtn=null;
function drawEnd(){
 if(!glReady)drawMap();drawParts();
 ctx.fillStyle='rgba(8,6,20,.82)';ctx.fillRect(0,0,W,H);
 if(state==='win'){
  bigText('BHOOT MARR GAYA!',W/2,H*.34,34,'#9dffb0','#2f9d5c');
  bigText('JEET GAYE!',W/2,H*.34+44,44,'#ffe36e','#ff9d3c');
 }else{
  bigText('PAKDA GAYA...',W/2,H*.34,40,'#ff8fa0','#b3123a');
 }
 ctx.fillStyle='#cfc4ff';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('time: '+Math.round(G.t)+'s   ·   bhoot Lv'+G.ghost.lv+'   ·   '+G.aliveCount+'/10 zinda',W/2,H*.46);
 ctx.fillText('bhoot ko diya damage: '+Math.round(G.dmgDone),W/2,H*.46+24);
 playBtn=btn('↻  PHIR SE',W/2-90,H*.56,180,58,'#ff4d6d','#b3123a',22);
}

// ---------- input ----------
function tap(x,y){
 if(state==='title'){
  if(playBtn&&x>=playBtn.x&&x<=playBtn.x+playBtn.w&&y>=playBtn.y&&y<=playBtn.y+playBtn.h){beep(440,.12,'sine',.06);newGame()}
  return;
 }
 if(state==='win'||state==='lose'){
  if(playBtn&&x>=playBtn.x&&x<=playBtn.x+playBtn.w&&y>=playBtn.y&&y<=playBtn.y+playBtn.h){beep(440,.12,'sine',.06);newGame()}
  return;
 }
 if(state!=='play')return;
 if(sheet){if(sheetTap(x,y))return;sheet=null;return}
 if(PLY>=0){const b=shopButtonRect();if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){openSheet(player());beep(500,.06,'sine',.04);return}}
 for(const rm of G.rooms){
  const r=roomRect(rm.i);
  if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){openSheet(rm);beep(500,.06,'sine',.04);return}
 }
}
function stickSet(x,y){const c=joystickCenter(),dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy),m=Math.min(1,d/JOY_R);stick=d<5?{x:0,y:0}:{x:dx/d*m,y:dy/d*m}}
cv.addEventListener('pointerdown',e=>{
 if(state==='move'){
  const c=joystickCenter();if(Math.hypot(e.clientX-c.x,e.clientY-c.y)<=JOY_R+28){movePointer=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}stickSet(e.clientX,e.clientY);e.preventDefault();return}
 }
 pDown={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{if(movePointer===e.pointerId){stickSet(e.clientX,e.clientY);e.preventDefault()}});
cv.addEventListener('pointerup',e=>{
 if(movePointer===e.pointerId){movePointer=null;stick={x:0,y:0};e.preventDefault();return}
 if(!pDown)return;const dx=e.clientX-pDown.x,dy=e.clientY-pDown.y;if(Math.hypot(dx,dy)<14)tap(e.clientX,e.clientY);pDown=null;
});
cv.addEventListener('pointercancel',e=>{if(movePointer===e.pointerId){movePointer=null;stick={x:0,y:0}}pDown=null});
const moveKeys={left:false,right:false,up:false,down:false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')moveKeys.left=true;if(k==='arrowright'||k==='d')moveKeys.right=true;if(k==='arrowup'||k==='w')moveKeys.up=true;if(k==='arrowdown'||k==='s')moveKeys.down=true});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')moveKeys.left=false;if(k==='arrowright'||k==='d')moveKeys.right=false;if(k==='arrowup'||k==='w')moveKeys.up=false;if(k==='arrowdown'||k==='s')moveKeys.down=false});

// ---------- main loop ----------
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if((state==='move'||state==='autoenter'||state==='settle'||state==='play')&&G)update(dt);
 ctx.clearRect(0,0,W,H);
 if(glReady&&G&&(state==='move'||state==='autoenter'||state==='settle'||state==='play'||state==='win'||state==='lose'))render3DWorld();
 if(state==='title')drawTitle();
 else if(state==='move'||state==='autoenter'||state==='settle'){if(!glReady){drawMap();drawAIRunners();drawRunner()}drawParts();drawHUD();drawJoystick();if(state==='move'){ctx.fillStyle='rgba(0,0,0,.72)';rr(W/2-92,H-138,184,22,10);ctx.fill();ctx.fillStyle='#e6f6ff';ctx.font='700 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('CHOOSE A DOOR · WALK INSIDE',W/2,H-127)}}
 else if(state==='play'){if(!glReady){drawMap();drawGhost()}drawParts();drawHUD();drawCombatStatus();drawShopButton();drawSheet();
  if(banner){ctx.fillStyle=banner.c;ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(banner.s,W/2,HUD+18);ctx.fillText(banner.s,W/2,HUD+18)}}
 else drawEnd();
 syncAudioUI();requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// ---------- test hooks ----------
window.__h={
 get state(){return state},
 get G(){return G},
 get sheet(){return sheet?{name:sheet.rm.name,isPlayer:sheet.rm.isPlayer}:null},
 get PLY(){return PLY},
 roomRect,doorPos,bedPos,turretPos,turretMuzzle,ghostScreenPoint,
 start:newGame,
 tap,
 move:(x,y)=>{if(!G)return;G.runner.x=x;G.runner.y=y;const i=roomForPoint(x,y);if(i>=0)claimRoom(i,false)},
 ownBed:()=>{const rm=player();return upgBed(rm)},
 ownDoor:()=>{const rm=player();return upgDoor(rm)},
 ownBuild:(k)=>buildTur(player(),k),
 ownUpgTur:(k)=>upgTur(player(),k),
 summary:()=>({state,t:G?G.t:0,ghost:G?{lv:G.ghost.lv,hp:Math.round(G.ghost.hp),mode:G.ghost.mode,target:G.ghost.target,
  enterStage:G.ghost.eStage,exitStage:G.ghost.exitStage,x:Math.round(G.ghost.x),y:Math.round(G.ghost.y)}:null,
  alive:G?G.aliveCount:0,phase:state,playerRoom:PLY,ai:G?G.aiRunners.map(a=>({name:a.name,room:a.room,dest:a.dest,done:a.done,x:Math.round(a.x),y:Math.round(a.y)})):[],
  rooms:G?G.rooms.map(r=>({name:r.name,alive:r.alive,player:r.isPlayer,bed:r.bedLv,doorLv:r.door.lv,doorHp:Math.round(r.door.hp),tur:r.turrets.map(t=>t?t.lv:0)})):[]})
};
</script></body></html>
