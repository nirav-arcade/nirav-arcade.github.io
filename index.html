<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<link rel="icon" href="data:,">
<title>NIRAV HAUNTED DORM</title>
<style>
html,body{margin:0;height:100%;background:#0b0a1a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));

// ---------- layout ----------
const HUD=56;
let corX,corW,roomW,rowH,mapH,PLY;
function layout(){
 mapH=H-HUD;
 corW=Math.max(50,Math.min(70,W*.17));
 corX=(W-corW)/2;
 roomW=(W-corW)/2;
 rowH=mapH/5;
}
// rooms: i = side*5 + row ; side 0 = left, 1 = right
function roomRect(i){
 const s=(i>=5)?1:0,r=i%5;
 return{x:s?corX+corW:0,y:HUD+r*rowH,w:roomW,h:rowH,side:s,row:r};
}
function doorPos(rm){
 const r=roomRect(rm);
 // The opening sits directly on the corridor/room boundary and is wide enough for the ghost to pass.
 const x=r.side?corX+corW:corX-22;
 return{x:x,y:r.y+r.h/2-23,w:22,h:46,cx:x+11,cy:r.y+r.h/2};
}
function bedPos(rm){
 const r=roomRect(rm);
 const bw=Math.min(64,r.w*.42),bh=Math.min(46,r.h*.4);
 const x=r.side?r.x+r.w-bw-8:r.x+8;
 return{x:x,y:r.y+r.h-bh-8,w:bw,h:bh,cx:x+bw/2,cy:r.y+r.h-bh/2-8};
}
function turretPos(rm,k){
 const r=roomRect(rm);
 const bp=bedPos(rm);
 const xs=r.side?[r.x+r.w-30,r.x+r.w-58,r.x+34]:[r.x+30,r.x+58,r.x+r.w-34];
 const ys=k===2?r.y+26:(k===0?r.y+r.h*.42:r.y+r.h*.62);
 return{x:xs[k],y:ys};
}

// ---------- data ----------
const BEDINC=[2,4,7,11,16,24],BEDCOST=[40,90,180,360,640];
const DOORHP=[200,420,800,1500,2600],DOORCOST=[40,90,180,360];
const TURLV=[{dmg:6,cost:30},{dmg:13,cost:60},{dmg:26,cost:120},{dmg:50,cost:220},{dmg:90}];
const NAMES=['NIRAV','RAHUL','PRIYA','AMAN','POOJA','ROHAN','SIMRAN','VIKRAM','NEHA','KABIR'];
const GLV=[null];for(let i=1;i<=14;i++)GLV.push({hp:Math.round(2600*Math.pow(1.5,i-1)),dmg:+(11*Math.pow(1.34,i-1)).toFixed(1),spd:30+3*i});

// ---------- state ----------
let state='title',G=null,sheet=null,parts=[],texts=[],banner=null,AC=null,audioOn=true;
let best=+localStorage.getItem('nhd3_best')||0;
function beep(f,d,type,v,slide){if(!audioOn)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),AC.currentTime+d);g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function ftext(x,y,s,c){texts.push({x,y,s,c:c||'#ffe36e',t:1.2})}
function say(s,c){banner={s,c:c||'#ff8fa0',t:2.6}}

function newGame(){
 const rooms=[];
 for(let i=0;i<10;i++){
  rooms.push({i,name:NAMES[i],alive:true,door:{lv:1,hp:DOORHP[0],max:DOORHP[0]},bedLv:1,
   coins:0,turrets:[null,null,null],smart:rnd(.35,1),actT:rnd(0,1.5),sleepPh:rnd(0,6),isPlayer:false,gone:0});
 }
 PLY=ri(0,9);
 rooms[PLY].isPlayer=true;rooms[PLY].coins=120;rooms[PLY].name='NIRAV';
 // make sure a room named NIRAV is not duplicated: rename if PLY was not 0
 for(let i=0;i<10;i++){if(i!==PLY&&rooms[i].name==='NIRAV')rooms[i].name='CHINTU'}
 G={t:0,rooms,lastPlyAtk:-99,
  ghost:{lv:1,hp:GLV[1].hp,max:GLV[1].hp,x:W/2,y:-40,mode:'spawn',target:-1,lastTarget:-1,ph:0,att:0,fl:0,regenCd:0,ax:W/2,ay:HUD+30},
  lvTimer:50,shake:0,aliveCount:10,dmgDone:0,thud:0};
 parts=[];texts=[];sheet=null;
 say('Bhoot aa raha hai... apna room taiyaar karo!','#9ad7ff');
 state='play';
}
function aliveRooms(){return G.rooms.filter(r=>r.alive)}
function player(){return G.rooms[PLY]}
function turDmg(t){return TURLV[t.lv-1].dmg}

// ---------- economy / actions (shared shape for player + AI) ----------
function income(rm){return BEDINC[rm.bedLv-1]}
function canPay(rm,c){return rm.coins>=c}
function pay(rm,c){if(rm.coins<c)return false;rm.coins-=c;return true}
function upgBed(rm){
 const c=BEDCOST[rm.bedLv-1];if(c===undefined||!pay(rm,c))return false;
 rm.bedLv++;return true;
}
function upgDoor(rm){
 const c=DOORCOST[rm.door.lv-1];if(c===undefined||!pay(rm,c))return false;
 rm.door.lv++;rm.door.max=DOORHP[rm.door.lv-1];rm.door.hp=rm.door.max;return true;
}
function buildTur(rm,k){
 if(rm.turrets[k])return false;
 if(!pay(rm,TURLV[0].cost))return false;
 rm.turrets[k]={lv:1,cd:0,kick:0};return true;
}
function upgTur(rm,k){
 const t=rm.turrets[k];if(!t)return false;
 const nx=TURLV[t.lv];if(!nx||nx.cost===undefined)return false;
 if(!pay(rm,nx.cost))return false;
 t.lv++;return true;
}
// player wrappers with feedback
function ownAct(fn,okMsg){
 const rm=player();if(!rm.alive)return;
 if(fn(rm)){beep(520,.15,'sine',.07);const r=roomRect(PLY);ftext(r.x+r.w/2,r.y+18,okMsg,'#9dffb0')}
 else{beep(120,.15,'square',.05);ftext(W/2,H*.5,'Coins kam hain!','#ff8f8f')}
}

// ---------- AI ----------
function aiTick(rm,dt){
 rm.coins+=income(rm)*dt;
 rm.actT-=dt;
 if(rm.actT>0)return;
 rm.actT=rnd(.9,1.8);
 if(Math.random()>rm.smart)return; // dumb AIs hesitate
 const gh=G.ghost;
 const threatened=(gh.target===rm.i&&(gh.mode==='attack'||gh.mode==='travel'))||rm.door.hp<rm.door.max*.55;
 // priorities
 if(!rm.turrets[0]){buildTur(rm,0);return}
 if(rm.bedLv<2){upgBed(rm);return}
 if(!rm.turrets[1]){buildTur(rm,1);return}
 if(threatened&&rm.door.lv<5&&rm.door.lv<rm.bedLv+2){if(upgDoor(rm))return}
 if(rm.bedLv<3&&rm.smart>.5){upgBed(rm);return}
 if(!rm.turrets[2]&&rm.smart>.45){buildTur(rm,2);return}
 if(threatened&&rm.door.lv<5){if(upgDoor(rm))return}
 // upgrade turrets
 const tu=rm.turrets.map((t,k)=>t?{t,k}:null).filter(Boolean).sort((a,b)=>a.t.lv-b.t.lv)[0];
 if(tu&&tu.t.lv<(rm.smart>.75?4:2)){if(upgTur(rm,tu.k))return}
 if(rm.bedLv<4&&rm.smart>.7){upgBed(rm);return}
 if(rm.door.lv<3){upgDoor(rm)}
}

// ---------- ghost ----------
// Every route between corridor and room passes through the broken doorway.
function corridorDoorPoint(rm){
 const dp=doorPos(rm.i);
 return{x:rm.i>=5?corX+corW-18:corX+18,y:dp.cy};
}
function insideDoorPoint(rm){
 const dp=doorPos(rm.i),dir=rm.i>=5?1:-1;
 return{x:dp.cx+dir*(dp.w/2+14),y:dp.cy};
}
function moveGhostTo(x,y,speed,dt){
 const gh=G.ghost,dx=x-gh.x,dy=y-gh.y,d=Math.hypot(dx,dy);
 const step=speed*dt;
 if(d<=step+1){gh.x=x;gh.y=y;return true}
 gh.x+=dx/d*step;gh.y+=dy/d*step;return false;
}
function setAtk(rm){
 const gh=G.ghost,cp=corridorDoorPoint(rm);
 gh.target=rm.i;gh.lastTarget=rm.i;
 gh.ax=cp.x;gh.ay=cp.y; // approach and attack from inside the corridor
 gh.mode='travel';
 if(rm.isPlayer){G.lastPlyAtk=G.t;say('BHOOT TUMHARE ROOM KI TARAF!','#ff5d78');beep(140,.5,'sawtooth',.08,.5)}
}
function pickTarget(){
 const gh=G.ghost,alive=aliveRooms();if(!alive.length)return;
 const pm=player();
 // the ghost comes for YOU regularly - first target is always the player, then at least every ~30s
 if(pm.alive&&G.t-G.lastPlyAtk>40){setAtk(pm);return}
 let bestRm=null,bestSc=1e9;
 for(const rm of alive){
  if(rm.isPlayer&&gh.lastTarget===PLY)continue; // just hit you - give you a breather, hit someone else
  let sc=rm.door.hp+rnd(0,140);
  const tdps=rm.turrets.filter(Boolean).reduce((s,t)=>s+turDmg(t),0);
  sc+=tdps*22;
  if(rm.isPlayer)sc-=70;
  if(sc<bestSc){bestSc=sc;bestRm=rm}
 }
 if(!bestRm)bestRm=pm.alive?pm:alive[0];
 setAtk(bestRm);
}
function hurtGhost(d,silent){
 const gh=G.ghost;if(state!=='play')return;
 gh.hp-=d;G.dmgDone+=d;if(!silent)gh.fl=.08;
 if(gh.hp<=0){gh.hp=0;finish(true)}
}
function updateGhost(dt){
 const gh=G.ghost,gl=GLV[gh.lv];
 gh.ph+=dt*4;if(gh.fl>0)gh.fl-=dt;
 G.lvTimer-=dt;if(G.lvTimer<=0){G.lvTimer=50;lvlUp()}
 switch(gh.mode){
  case 'spawn':{
   gh.y+=(HUD+mapH*.5-gh.y)*Math.min(1,dt*.9);
   if(gh.y>HUD+mapH*.4){gh.mode='roam';gh.rt=3.5;gh.ty=HUD+rnd(mapH*.2,mapH*.8)}
   break}
  case 'roam':{
   gh.rt-=dt;
   gh.y+=Math.sign(gh.ty-gh.y)*gl.spd*dt;
   if(Math.abs(gh.ty-gh.y)<8){gh.ty=HUD+rnd(mapH*.08,mapH*.92)}
   if(gh.rt<=0){gh.x+=(W/2-gh.x)*Math.min(1,dt*6);pickTarget()}
   break}
  case 'travel':{
   const dx=gh.ax-gh.x,dy=gh.ay-gh.y,d=Math.hypot(dx,dy);
   if(d<6){gh.mode='attack';gh.att=0;gh.holdT=0;if(gh.target===PLY)G.lastPlyAtk=G.t;break}
   gh.x+=dx/d*gl.spd*1.4*dt;gh.y+=dy/d*gl.spd*1.4*dt;
   break}
  case 'attack':{
   const rm=G.rooms[gh.target];
   if(!rm||!rm.alive){gh.mode='roam';gh.rt=1;break}
   if(rm.door.hp<=0){
    gh.mode='enter';gh.eStage=0;
    const dp=doorPos(rm.i),ip=insideDoorPoint(rm);
    const bp=bedPos(rm.i);
    gh.enterRoute=[{x:dp.cx,y:dp.cy},ip,{x:bp.cx,y:bp.cy}];
    say(rm.isPlayer?'TUMHARA DOOR TUT GAYA!':rm.name+' KA DOOR TUT GAYA!','#ff3b30');
    beep(60,.6,'sawtooth',.09,.3);G.shake=Math.max(G.shake,9);
    break}
   let dps=gl.dmg;
   if(rm.door.hp/rm.door.max<.3)dps*=1.35;
   rm.door.hp=Math.max(0,rm.door.hp-dps*dt);
   G.shake=Math.max(G.shake,1.4);
   gh.att+=dt;
   const dp=doorPos(rm.i);
   if(gh.att>.5){gh.att=0;beep(90,.09,'square',.045);
    parts.push({x:dp.cx+rnd(-10,10),y:dp.cy+rnd(-16,16),vx:rnd(-30,30),vy:rnd(-60,-10),life:.5,c:'#c9a24a',s:3})}
   if(gh.hp<gh.max*.20&&gh.regenCd<=0){gh.mode='flee';gh.fy=HUD+20;say('Bhoot bhaag raha hai!','#9dffb0')}
   // gives up on a door that holds too long - moves to the next room like the real game
   gh.holdT+=dt;
   if(gh.holdT>22){say(rm.isPlayer?'Bhoot haar ke chala gaya... abhi wapas aayega!':'Bhoot doosre room ki taraf gaya','#9ad7ff');gh.mode='roam';gh.rt=.8;gh.ty=gh.y+rnd(-60,60)}
   break}
  case 'enter':{
   const p=gh.enterRoute&&gh.enterRoute[gh.eStage];
   if(!p){eliminate(gh.target);break}
   if(moveGhostTo(p.x,p.y,gh.eStage<2?70:78,dt)){
    gh.eStage++;
    if(gh.eStage>=gh.enterRoute.length)eliminate(gh.target);
   }
   break}
  case 'exit':{
   const p=gh.exitRoute&&gh.exitRoute[gh.exitStage];
   if(!p){finishGhostExit();break}
   if(moveGhostTo(p.x,p.y,78,dt)){
    gh.exitStage++;
    if(gh.exitStage>=gh.exitRoute.length)finishGhostExit();
   }
   break}
  case 'flee':{
   gh.y-=gl.spd*2*dt;
   if(gh.y<=gh.fy){gh.mode='regen';gh.rt=0}
   break}
  case 'regen':{
   gh.hp=Math.min(gh.max*.55,gh.hp+gh.max*.05*dt);gh.rt+=dt;
   if(gh.rt>3||gh.hp>=gh.max*.55){gh.regenCd=24;say('Bhoot wapas aa gaya!','#ff8fa0');pickTarget()}
   break}
 }
 if(gh.regenCd>0)gh.regenCd-=dt;
}
function eliminate(idx){
 const rm=G.rooms[idx];if(!rm||!rm.alive)return;
 rm.alive=false;rm.gone=G.t;G.aliveCount--;
 const gh=G.ghost,dp=doorPos(idx),ip=insideDoorPoint(rm),cp=corridorDoorPoint(rm);
 gh.hp=Math.min(gh.max,gh.hp+gh.max*.35);
 gh.exitPlayer=rm.isPlayer;
 gh.exitStage=0;
 gh.exitRoute=[ip,{x:dp.cx,y:dp.cy},cp];
 gh.mode='exit';gh.target=idx;
 const r=roomRect(idx);
 for(let i=0;i<14;i++)parts.push({x:r.x+r.w/2,y:r.y+r.h/2,vx:rnd(-90,90),vy:rnd(-120,20),life:rnd(.4,.9),c:'#b08cff',s:ri(2,4)});
 beep(48,.9,'sawtooth',.09,.35);G.shake=12;
 say(rm.isPlayer?'TUMHE PAKAD LIYA!':rm.name+' PAKDA GAYA!  '+G.aliveCount+' bache','#ff8fa0');
}
function finishGhostExit(){
 const gh=G.ghost,wasPlayer=gh.exitPlayer;
 gh.mode='roam';gh.rt=1.1;gh.ty=HUD+rnd(mapH*.1,mapH*.9);gh.target=-1;
 gh.exitRoute=null;gh.enterRoute=null;gh.exitPlayer=false;
 if(wasPlayer)finish(false);
}
function lvlUp(){
 const gh=G.ghost;gh.lv=Math.min(14,gh.lv+1);
 gh.max=GLV[gh.lv].hp;gh.hp=Math.min(gh.max,gh.hp+gh.max*.6);
 say('BHOOT LEVEL UP!  Lv'+gh.lv,'#ff5d78');beep(70,.7,'sawtooth',.08,.4);G.shake=Math.max(G.shake,6);
}

// ---------- update ----------
function update(dt){
 G.t+=dt;
 for(const rm of G.rooms){
  if(!rm.alive)continue;
  if(rm.isPlayer)rm.coins+=income(rm)*dt;
  else aiTick(rm,dt);
  // door slowly repairs itself while the ghost is not pounding it
  const underAttack=G.ghost.target===rm.i&&G.ghost.mode==='attack';
  if(!underAttack&&rm.door.hp>0&&rm.door.hp<rm.door.max)rm.door.hp=Math.min(rm.door.max,rm.door.hp+8*dt);
  // turrets fire
  for(let k=0;k<3;k++){
   const t=rm.turrets[k];if(!t)continue;
   t.cd-=dt;if(t.kick>0)t.kick-=dt;
   const gh=G.ghost;if(gh.mode==='spawn')continue;
   const tp=turretPos(rm.i,k);
   const R=rowH*1.6;
   if(Math.hypot(gh.x-tp.x,gh.y-tp.y)<R&&t.cd<=0){
    t.cd=.5;t.kick=.1;
    hurtGhost(TURLV[t.lv-1].dmg*.5);
    parts.push({x:tp.x,y:tp.y,vx:0,vy:0,life:.22,c:'#9aeaff',s:3,bolt:true,tx:gh.x,ty2:gh.y});
    beep(620,.05,'square',.016,.6);
   }
  }
 }
 updateGhost(dt);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
 for(let i=texts.length-1;i>=0;i--){texts[i].t-=dt;texts[i].y-=22*dt;if(texts[i].t<=0)texts.splice(i,1)}
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 G.shake*=.86;
}
function finish(win){
 state=win?'win':'lose';
 if(win){beep(660,.4,'sine',.07);setTimeout(()=>beep(880,.5,'sine',.07),180);
  const sc=Math.round(G.t);if(!best||sc<best){best=sc;localStorage.setItem('nhd3_best',best)}}
 else{beep(55,1,'sawtooth',.09,.4)}
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bigText(txt,x,y,size,c1,c2){
 ctx.font='900 '+size+'px Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*.14);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(txt,x,y);
 const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillText(txt,x,y);
}
function btn(label,x,y,w,h,c1,c2,fs,sub,dim){
 ctx.save();if(!dim){ctx.shadowColor=c1;ctx.shadowBlur=12}
 const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;rr(x,y,w,h,Math.min(12,h/2));ctx.fill();ctx.restore();
 if(dim){ctx.fillStyle='rgba(20,16,40,.55)';rr(x,y,w,h,Math.min(12,h/2));ctx.fill()}
 ctx.fillStyle=dim?'rgba(255,255,255,.55)':'#fff';ctx.font='800 '+(fs||Math.round(h*.3))+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(label,x+w/2,y+(sub?h*.32:h/2+1));
 if(sub){ctx.font='600 '+Math.round(h*.19)+'px system-ui';ctx.fillStyle=dim?'rgba(255,255,255,.4)':'rgba(255,255,255,.85)';ctx.fillText(sub,x+w/2,y+h*.7)}
 return{x,y,w,h};
}
function hpBar(x,y,w,h,frac,c){
 ctx.fillStyle='rgba(0,0,0,.65)';rr(x-1,y-1,w+2,h+2,3);ctx.fill();
 ctx.fillStyle=c;rr(x,y,Math.max(0,w*Math.min(1,frac)),h,2);ctx.fill();
}

function drawMap(){
 ctx.fillStyle='#100c22';ctx.fillRect(0,HUD,W,mapH);
 // corridor
 ctx.fillStyle='#1d1636';ctx.fillRect(corX,HUD,corW,mapH);
 ctx.fillStyle='#241c44';ctx.fillRect(corX+corW*.34,HUD,corW*.32,mapH);
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
 for(let y=HUD;y<H;y+=26){ctx.beginPath();ctx.moveTo(corX+corW*.34,y);ctx.lineTo(corX+corW*.66,y);ctx.stroke()}
 // lamps
 const fl=.75+Math.sin((G?G.t:0)*7)*.15;
 for(let k=0;k<5;k++){
  const ly=HUD+rowH*(k+.5);
  const lg=ctx.createRadialGradient(W/2,ly,2,W/2,ly,40);
  lg.addColorStop(0,'rgba(255,220,140,'+(.35*fl)+')');lg.addColorStop(1,'rgba(255,220,140,0)');
  ctx.fillStyle=lg;ctx.fillRect(corX-10,ly-40,corW+20,80);
  ctx.fillStyle='#ffe6a8';ctx.beginPath();ctx.arc(W/2,ly,3.4,0,6.3);ctx.fill();
 }
 // rooms
 for(const rm of G.rooms)drawRoom(rm);
}
function drawRoom(rm){
 const r=roomRect(rm.i);
 const dead=!rm.alive;
 // floor
 ctx.fillStyle=dead?'#0d0a18':((rm.row+rm.side)%2?'#221a40':'#1e1738');
 ctx.fillRect(r.x+1,r.y+1,r.w-2,r.h-2);
 ctx.strokeStyle=rm.isPlayer&&!dead?'rgba(255,213,74,.85)':'rgba(0,0,0,.55)';
 ctx.lineWidth=rm.isPlayer&&!dead?2.4:1.4;
 ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2);
 // name + zzz
 ctx.textAlign='left';ctx.textBaseline='alphabetic';
 ctx.font='800 10px system-ui';
 ctx.fillStyle=dead?'rgba(255,120,120,.8)':(rm.isPlayer?'#ffd54a':'rgba(210,200,255,.85)');
 const nx=r.side?r.x+r.w-8-ctx.measureText(rm.name).width:r.x+8;
 ctx.fillText(rm.name,nx,r.y+15);
 if(!dead){
  const zo=Math.sin(G.t*1.4+rm.sleepPh)*3;
  ctx.fillStyle='rgba(157,255,176,.75)';ctx.font='600 9px system-ui';
  ctx.fillText('z z',nx+2,r.y+27+zo);
 }
 if(dead){
  const dp=doorPos(rm.i);
  ctx.fillStyle='#1a1024';ctx.fillRect(dp.x,dp.y,dp.w,dp.h);
  ctx.strokeStyle='rgba(201,162,74,.75)';ctx.lineWidth=2;ctx.strokeRect(dp.x,dp.y,dp.w,dp.h);
  ctx.font='26px system-ui';ctx.textAlign='center';
  ctx.fillText('💀',r.x+r.w/2,r.y+r.h/2+8);
  ctx.font='700 9px system-ui';ctx.fillStyle='rgba(255,110,110,.8)';
  ctx.fillText('PAKDA GAYA',r.x+r.w/2,r.y+r.h/2+26);
  return;
 }
 // door
 const dp=doorPos(rm.i);
 const cols=['#6b3d1f','#7a4a3a','#5a5f6e','#3f6b8a','#8a6a2f'];
 const cols2=['#8a5028','#9a6248','#7a8092','#5a92b8','#c9a24a'];
 if(rm.door.hp>0){
  ctx.fillStyle=cols[rm.door.lv-1];ctx.fillRect(dp.x,dp.y,dp.w,dp.h);
  ctx.fillStyle=cols2[rm.door.lv-1];ctx.fillRect(dp.x+3,dp.y+4,dp.w-6,dp.h-8);
  if(rm.door.lv>=3){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(dp.x+2,dp.y+dp.h/2);ctx.lineTo(dp.x+dp.w-2,dp.y+dp.h/2);ctx.stroke()}
 }else{
  ctx.fillStyle='#1a1024';ctx.fillRect(dp.x,dp.y,dp.w,dp.h);
 }
 hpBar(r.side?dp.x+dp.w+3:dp.x-9,dp.y,6,dp.h,rm.door.hp/rm.door.max,rm.door.hp/rm.door.max>.4?'#4cd964':'#ff9500');
 // bed
 const bp=bedPos(rm.i);
 ctx.fillStyle='#223a7a';rr(bp.x,bp.y,bp.w,bp.h,6);ctx.fill();
 ctx.fillStyle='#2f55b0';rr(bp.x+3,bp.y+bp.h*.42,bp.w-6,bp.h*.5,5);ctx.fill();
 ctx.fillStyle='#e8ecff';rr(bp.x+4,bp.y+4,bp.w*.34,bp.h*.3,4);ctx.fill();
 // sleeper head
 ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(bp.x+bp.w*.22,bp.y+bp.h*.55,6,0,6.3);ctx.fill();
 ctx.fillStyle='#ffd54a';ctx.font='700 8px system-ui';ctx.textAlign='center';
 ctx.fillText('Lv'+rm.bedLv,bp.cx,bp.y+bp.h+9);
 // turrets
 for(let k=0;k<3;k++){
  const tp=turretPos(rm.i,k),t=rm.turrets[k];
  if(!t){
   if(rm.isPlayer){ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.strokeRect(tp.x-9,tp.y-9,18,18)}
   continue;
  }
  const kick=t.kick>0?2:0;
  ctx.fillStyle='#173a52';ctx.beginPath();ctx.arc(tp.x,tp.y,10+kick,0,6.3);ctx.fill();
  ctx.fillStyle='#4ad8ff';ctx.beginPath();ctx.arc(tp.x,tp.y,5.5,0,6.3);ctx.fill();
  // barrel toward corridor
  ctx.strokeStyle='#9aeaff';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(tp.x,tp.y);ctx.lineTo(tp.x+(r.side?12:-12),tp.y);ctx.stroke();
  ctx.fillStyle='#ffd54a';ctx.font='700 8px system-ui';ctx.textAlign='center';
  ctx.fillText(t.lv,tp.x,tp.y+17);
 }
 // player marker
 if(rm.isPlayer){
  ctx.fillStyle='rgba(255,213,74,.95)';ctx.font='800 9px system-ui';ctx.textAlign='center';
  ctx.fillText('★ TUMHARA ROOM',r.x+r.w/2,r.y+r.h-6);
 }
}
function drawGhost(){
 const gh=G.ghost;ctx.save();
 const passDoor=(gh.mode==='enter'&&gh.eStage<2)||(gh.mode==='exit'&&gh.exitStage>=1);
 const bob=Math.sin(gh.ph)*4;
 ctx.translate(gh.x+((G.shake>1)?rnd(-G.shake,G.shake)*.4:0),gh.y+bob);
 const gr=17;
 if(passDoor)ctx.scale(.64,.64);
 const gg=ctx.createRadialGradient(0,-4,2,0,0,gr+10);
 gg.addColorStop(0,gh.fl>0?'#ffffff':'#b08cff');gg.addColorStop(1,'rgba(80,40,160,.15)');
 ctx.fillStyle=gg;
 ctx.beginPath();ctx.arc(0,0,gr,0,6.3);ctx.fill();
 // tail waves
 ctx.beginPath();ctx.moveTo(-gr,4);
 for(let i=0;i<=6;i++){ctx.lineTo(-gr+i*(gr*2/6),gr*.7+Math.sin(gh.ph*1.6+i)*5)}
 ctx.lineTo(gr,4);ctx.closePath();ctx.fill();
 // eyes
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-4,4.4,0,6.3);ctx.arc(6,-4,4.4,0,6.3);ctx.fill();
 ctx.fillStyle='#1a0b2e';ctx.beginPath();ctx.arc(-5.4,-4,2.1,0,6.3);ctx.arc(6.6,-4,2.1,0,6.3);ctx.fill();
 // mouth
 ctx.fillStyle='#2a1450';ctx.beginPath();ctx.arc(0,5,4.4,0,3.2);ctx.fill();
 ctx.restore();
 // hp bar + lv
 hpBar(gh.x-30,gh.y-34,60,6,gh.hp/gh.max,'#b06bff');
 ctx.fillStyle='#e6d6ff';ctx.font='800 10px system-ui';ctx.textAlign='center';
 ctx.fillText('BHOOT Lv'+gh.lv,gh.x,gh.y-40);
}
function drawParts(){
 for(const p of parts){
  ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2.4));
  if(p.bolt){
   ctx.strokeStyle=p.c;ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.tx,p.ty2);ctx.stroke();
  }else{ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.globalAlpha=1;
 }
 for(const t of texts){
  ctx.globalAlpha=Math.max(0,Math.min(1,t.t));
  ctx.fillStyle=t.c;ctx.font='800 13px system-ui';ctx.textAlign='center';
  ctx.fillText(t.s,t.x,t.y);ctx.globalAlpha=1;
 }
}
function drawHUD(){
 ctx.fillStyle='#0d0a1e';ctx.fillRect(0,0,W,HUD);
 ctx.fillStyle='#1d1636';ctx.fillRect(0,HUD-3,W,3);
 const rm=player();
 ctx.textBaseline='middle';
 // coins
 ctx.fillStyle='#ffd54a';ctx.font='800 16px system-ui';ctx.textAlign='left';
 ctx.fillText('💰'+Math.floor(rm.alive?rm.coins:0),10,20);
 ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='600 10px system-ui';
 ctx.fillText('+'+income(rm)+'/s (bed Lv'+rm.bedLv+')',10,40);
 // alive count
 ctx.fillStyle='#9dffb0';ctx.font='800 13px system-ui';ctx.textAlign='center';
 ctx.fillText('😴 '+G.aliveCount+'/10 zinda',W/2,20);
 ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='600 10px system-ui';
 ctx.fillText('bhoot Lv'+G.ghost.lv+'  ·  '+Math.ceil(G.lvTimer)+'s me LvUp',W/2,40);
 // ghost hp mini bar
 hpBar(W-96,13,86,9,G.ghost.hp/G.ghost.max,'#b06bff');
 ctx.fillStyle='#e6d6ff';ctx.font='700 9px system-ui';ctx.textAlign='right';
 ctx.fillText('BHOOT',W-10,38);
}
// ---------- sheet (own room management / other room view) ----------
let sheetBtns=[];
function openSheet(rm){
 sheet={rm};
}
function drawSheet(){
 if(!sheet)return;
 const rm=sheet.rm,r=roomRect(rm.i);
 const shH=rm.isPlayer?212:150;
 const y0=H-shH;
 ctx.fillStyle='rgba(10,8,24,.94)';ctx.fillRect(0,y0,W,shH);
 ctx.strokeStyle='rgba(255,213,74,.5)';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
 ctx.fillStyle=rm.isPlayer?'#ffd54a':'#cfc4ff';ctx.font='800 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText((rm.isPlayer?'TUMHARA ROOM':'ROOM: '+rm.name)+(rm.alive?'':'  (pakda gaya)'),W/2,y0+20);
 sheetBtns=[];
 if(!rm.alive){sheetBtns.push(btn('BAND KARO',W/2-70,y0+shH-52,140,38,'#3a3a55','#262640'));return}
 if(!rm.isPlayer){
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='600 12px system-ui';
  ctx.fillText('Bed Lv'+rm.bedLv+'  ·  Door Lv'+rm.door.lv+' ('+Math.ceil(rm.door.hp)+'/'+rm.door.max+' HP)',W/2,y0+48);
  const tl=rm.turrets.map(t=>t?'🔫Lv'+t.lv:'—').join('  ');
  ctx.fillText('Turrets: '+tl,W/2,y0+72);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 11px system-ui';
  ctx.fillText('(AI khel raha hai - sirf dekh sakte ho)',W/2,y0+94);
  sheetBtns.push(btn('BAND KARO',W/2-70,y0+shH-52,140,38,'#3a3a55','#262640'));
  return;
 }
 const bw=(W-32-24)/2,bh=44;
 const bc=BEDCOST[rm.bedLv-1],dc=DOORCOST[rm.door.lv-1];
 sheetBtns.push(btn('BED Lv'+(rm.bedLv+1),16,y0+40,bw,bh,'#2f6bd8','#1d3f8a',15,bc!==undefined?('💰'+bc+'  → +'+BEDINC[rm.bedLv]+'/s'):'MAX',bc===undefined||rm.coins<bc));
 sheetBtns[sheetBtns.length-1].act='bed';
 sheetBtns.push(btn('DOOR Lv'+(rm.door.lv+1),16+bw+24,y0+40,bw,bh,'#8a5a2f','#5a3a1d',15,dc!==undefined?('💰'+dc+'  → '+DOORHP[rm.door.lv]+' HP'):'MAX',dc===undefined||rm.coins<dc));
 sheetBtns[sheetBtns.length-1].act='door';
 // turrets
 const tw=(W-32-24)/3;
 for(let k=0;k<3;k++){
  const t=rm.turrets[k];
  let label,sub,dim,cost;
  if(!t){label='🔫 BANAO';sub='💰'+TURLV[0].cost;cost=TURLV[0].cost}
  else if(t.lv<TURLV.length&&TURLV[t.lv].cost!==undefined){label='🔫 Lv'+(t.lv+1);sub='💰'+TURLV[t.lv].cost;cost=TURLV[t.lv].cost}
  else{label='🔫 MAX';sub='';cost=1e9}
  sheetBtns.push(btn(label,16+k*(tw+12),y0+96,tw,44,'#1d7a8a','#0f4a55',14,sub,rm.coins<cost));
  sheetBtns[sheetBtns.length-1].act='tur'+k;
 }
 sheetBtns.push(btn('BAND KARO',W/2-70,y0+shH-50,140,36,'#3a3a55','#262640'));
 sheetBtns[sheetBtns.length-1].act='close';
}
function sheetTap(x,y){
 for(const b of sheetBtns){
  if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
   const rm=sheet.rm;
   if(b.act==='close'||!rm.isPlayer){sheet=null;return true}
   if(b.act==='bed')ownAct(upgBed,'Bed Lv'+player().bedLv);
   else if(b.act==='door')ownAct(upgDoor,'Door Lv'+player().door.lv);
   else if(b.act&&b.act.indexOf('tur')===0){
    const k=+b.act.slice(3);
    if(rm.turrets[k])ownAct(m=>upgTur(m,k),'Turret Lv'+(rm.turrets[k]?rm.turrets[k].lv:1));
    else if(buildTur(rm,k)){beep(300,.12,'triangle',.06);ftext(W/2,y0OfSheet(),'Turret ready!','#9dffb0')}
    else{beep(120,.15,'square',.05);ftext(W/2,H*.5,'Coins kam hain!','#ff8f8f')}
   }
   return true;
  }
 }
 return false;
}
function y0OfSheet(){return H-220}

// ---------- title / end ----------
function drawTitle(){
 ctx.fillStyle='#0b0a1a';ctx.fillRect(0,0,W,H);
 const t=performance.now()/1000;
 // moon
 const mg=ctx.createRadialGradient(W*.8,H*.14,4,W*.8,H*.14,70);
 mg.addColorStop(0,'rgba(230,230,255,.9)');mg.addColorStop(1,'rgba(230,230,255,0)');
 ctx.fillStyle=mg;ctx.fillRect(W*.8-70,H*.14-70,140,140);
 // dorm silhouette with 10 windows
 ctx.fillStyle='#171130';ctx.fillRect(W*.1,H*.34,W*.8,H*.3);
 for(let rr2=0;rr2<2;rr2++)for(let cc=0;cc<5;cc++){
  const wx=W*.1+W*.08+cc*W*.145,wy=H*.36+rr2*H*.13;
  ctx.fillStyle=Math.sin(t*2+rr2*3+cc)>-.2?'rgba(255,220,140,.85)':'rgba(120,110,160,.5)';
  ctx.fillRect(wx,wy,W*.075,H*.075);
 }
 // mini ghost
 ctx.save();ctx.translate(W/2+Math.sin(t*1.3)*30,H*.24+Math.sin(t*2.6)*7);
 ctx.fillStyle='rgba(176,140,255,.9)';ctx.beginPath();ctx.arc(0,0,15,0,6.3);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-3,3.4,0,6.3);ctx.arc(5,-3,3.4,0,6.3);ctx.fill();
 ctx.fillStyle='#1a0b2e';ctx.beginPath();ctx.arc(-4.6,-3,1.7,0,6.3);ctx.arc(5.4,-3,1.7,0,6.3);ctx.fill();
 ctx.restore();
 bigText('NIRAV',W/2,H*.52,52,'#ffe36e','#ff9d3c');
 bigText('HAUNTED DORM',W/2,H*.52+48,34,'#c9b8ff','#7a5cff');
 ctx.fillStyle='#cfc4ff';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('10 log sote hain... bhoot sabke darwaze todega',W/2,H*.68);
 playBtn=btn('▶  KHELO',W/2-90,H*.74,180,62,'#ff4d6d','#b3123a',24);
 if(best>0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 12px system-ui';ctx.fillText('best jeet: '+best+'s',W/2,H*.88)}
}
let playBtn=null;
function drawEnd(){
 drawMap();drawParts();
 ctx.fillStyle='rgba(8,6,20,.82)';ctx.fillRect(0,0,W,H);
 if(state==='win'){
  bigText('BHOOT MARR GAYA!',W/2,H*.34,34,'#9dffb0','#2f9d5c');
  bigText('JEET GAYE!',W/2,H*.34+44,44,'#ffe36e','#ff9d3c');
 }else{
  bigText('PAKDA GAYA...',W/2,H*.34,40,'#ff8fa0','#b3123a');
 }
 ctx.fillStyle='#cfc4ff';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('time: '+Math.round(G.t)+'s   ·   bhoot Lv'+G.ghost.lv+'   ·   '+G.aliveCount+'/10 zinda',W/2,H*.46);
 ctx.fillText('bhoot ko diya damage: '+Math.round(G.dmgDone),W/2,H*.46+24);
 playBtn=btn('↻  PHIR SE',W/2-90,H*.56,180,58,'#ff4d6d','#b3123a',22);
}

// ---------- input ----------
function tap(x,y){
 if(state==='title'||state==='win'||state==='lose'){
  if(playBtn&&x>=playBtn.x&&x<=playBtn.x+playBtn.w&&y>=playBtn.y&&y<=playBtn.y+playBtn.h){beep(440,.12,'sine',.06);newGame()}
  return;
 }
 if(state!=='play')return;
 if(sheet){if(sheetTap(x,y))return;sheet=null;return}
 for(const rm of G.rooms){
  const r=roomRect(rm.i);
  if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){openSheet(rm);beep(500,.06,'sine',.04);return}
 }
}
let pDown=null;
cv.addEventListener('pointerdown',e=>{pDown={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{
 if(!pDown)return;
 const dx=e.clientX-pDown.x,dy=e.clientY-pDown.y;
 if(Math.hypot(dx,dy)<14)tap(e.clientX,e.clientY);
 pDown=null;
});

// ---------- main loop ----------
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(state==='play'&&G)update(dt);
 ctx.clearRect(0,0,W,H);
 if(state==='title')drawTitle();
 else if(state==='play'){drawMap();drawGhost();drawParts();drawHUD();drawSheet();
  if(banner){ctx.fillStyle=banner.c;ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(banner.s,W/2,HUD+18);ctx.fillText(banner.s,W/2,HUD+18)}}
 else drawEnd();
 requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// ---------- test hooks ----------
window.__h={
 get state(){return state},
 get G(){return G},
 get sheet(){return sheet?{name:sheet.rm.name,isPlayer:sheet.rm.isPlayer}:null},
 get PLY(){return PLY},
 roomRect,doorPos,bedPos,
 start:newGame,
 tap,
 ownBed:()=>{const rm=player();return upgBed(rm)},
 ownDoor:()=>{const rm=player();return upgDoor(rm)},
 ownBuild:(k)=>buildTur(player(),k),
 ownUpgTur:(k)=>upgTur(player(),k),
 summary:()=>({state,t:G?G.t:0,ghost:G?{lv:G.ghost.lv,hp:Math.round(G.ghost.hp),mode:G.ghost.mode,target:G.ghost.target,
  enterStage:G.ghost.eStage,exitStage:G.ghost.exitStage,x:Math.round(G.ghost.x),y:Math.round(G.ghost.y)}:null,
  alive:G?G.aliveCount:0,
  rooms:G?G.rooms.map(r=>({name:r.name,alive:r.alive,player:r.isPlayer,bed:r.bedLv,doorLv:r.door.lv,doorHp:Math.round(r.door.hp),tur:r.turrets.map(t=>t?t.lv:0)})):[]})
};
</script></body></html>
