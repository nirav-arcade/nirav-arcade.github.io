<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Indian Bike 3D Prototype - NIRAV ROKADE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
    
    /* Top Header */
    #header {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #00ffcc; padding: 8px 18px;
      border-radius: 20px; font-weight: bold; font-size: 15px;
      border: 1px solid #00ffcc; z-index: 10; text-align: center;
    }

    /* Speedometer */
    #speedo {
      position: fixed; top: 15px; left: 15px;
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px 14px;
      border-radius: 10px; font-size: 14px; z-index: 10;
    }

    /* Phone Dialer Button */
    #phoneBtn {
      position: fixed; top: 15px; right: 15px;
      background: #28a745; color: white; border: none;
      padding: 12px 16px; border-radius: 50px; font-size: 16px;
      font-weight: bold; cursor: pointer; z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    /* Cheat Code Mobile UI */
    #phoneUI {
      display: none; position: fixed; top: 70px; right: 15px;
      width: 220px; background: #1e1e2e; color: white;
      border-radius: 18px; padding: 15px; z-index: 20;
      border: 2px solid #00ffcc; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    #phoneUI h4 { text-align: center; margin-bottom: 8px; color: #00ffcc; }
    #cheatInput {
      width: 100%; padding: 8px; font-size: 18px; text-align: center;
      border-radius: 8px; border: none; margin-bottom: 8px; font-weight: bold;
    }
    .dial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .dial-grid button {
      padding: 10px; font-size: 16px; border: none; border-radius: 8px;
      background: #333; color: white; font-weight: bold; cursor: pointer;
    }
    .dial-grid button:active { background: #00ffcc; color: black; }
    #callBtn {
      width: 100%; margin-top: 8px; padding: 10px; background: #28a745;
      color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    #cheatHints { font-size: 11px; color: #ccc; margin-top: 8px; line-height: 1.4; }

    /* Mobile Touch Controls */
    .controls {
      position: fixed; bottom: 20px; width: 100%;
      display: flex; justify-content: space-between; padding: 0 20px; z-index: 10;
    }
    .btn-group { display: flex; gap: 12px; }
    .ctrl-btn {
      width: 65px; height: 65px; border-radius: 50%;
      background: rgba(0,0,0,0.6); color: white; border: 2px solid white;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }
    .ctrl-btn:active { background: rgba(0,255,204,0.6); color: black; }
  </style>
</head>
<body>

  <div id="header">NIRAV ROKADE - INDIAN BIKE 3D</div>
  <div id="speedo">Speed: <span id="spd">0</span> km/h<br>Vehicle: <span id="vehName">Sports Bike</span></div>
  <button id="phoneBtn">📱 Cheat Phone</button>

  <!-- Cheat Code Dialer -->
  <div id="phoneUI">
    <h4>CHEAT DIALER</h4>
    <input type="text" id="cheatInput" placeholder="Enter Code" readonly />
    <div class="dial-grid">
      <button onclick="addNum('1')">1</button>
      <button onclick="addNum('2')">2</button>
      <button onclick="addNum('3')">3</button>
      <button onclick="addNum('4')">4</button>
      <button onclick="addNum('5')">5</button>
      <button onclick="addNum('6')">6</button>
      <button onclick="addNum('7')">7</button>
      <button onclick="addNum('8')">8</button>
      <button onclick="addNum('9')">9</button>
      <button onclick="clearNum()">C</button>
      <button onclick="addNum('0')">0</button>
      <button onclick="togglePhone()">X</button>
    </div>
    <button id="callBtn" onclick="applyCheat()">📞 CALL / SPAWN</button>
    <div id="cheatHints">
      <b>Cheat Codes:</b><br>
      • <b>400</b> : Super Bike<br>
      • <b>1000</b> : Fortuner SUV<br>
      • <b>9999</b> : Super Jump!<br>
      • <b>1111</b> : Night Mode
    </div>
  </div>

  <!-- On-screen Driving Buttons -->
  <div class="controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="leftBtn">◀</button>
      <button class="ctrl-btn" id="rightBtn">▶</button>
    </div>
    <div class="btn-group">
      <button class="ctrl-btn" id="brakeBtn">S</button>
      <button class="ctrl-btn" id="gasBtn">W</button>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // 1. Scene, Camera, Renderer Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 220);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // 3. Ground & Roads
    const groundGeo = new THREE.PlaneGeometry(600, 600);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Main Highway Road
    const roadGeo = new THREE.PlaneGeometry(18, 600);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    scene.add(road);

    // Road White Stripes
    for (let z = -280; z < 280; z += 15) {
      const stripe = new THREE.Mesh(
        new THREE.PlaneGeometry(0.5, 6),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.04, z);
      scene.add(stripe);
    }

    // 4. City Buildings & Ramps
    const buildingColors = [0xd9534f, 0xf0ad4e, 0x5bc0de, 0x9b59b6, 0xecf0f1];
    for (let i = 0; i < 45; i++) {
      const w = 10 + Math.random() * 10;
      const h = 15 + Math.random() * 35;
      const d = 10 + Math.random() * 10;
      const bGeo = new THREE.BoxGeometry(w, h, d);
      const bMat = new THREE.MeshLambertMaterial({
        color: buildingColors[Math.floor(Math.random() * buildingColors.length)]
      });
      const building = new THREE.Mesh(bGeo, bMat);
      
      let xPos = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 120);
      let zPos = (Math.random() - 0.5) * 450;
      building.position.set(xPos, h / 2, zPos);
      scene.add(building);
    }

    // Stunt Ramp
    const rampGeo = new THREE.BoxGeometry(10, 1, 16);
    const rampMat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
    const ramp = new THREE.Mesh(rampGeo, rampMat);
    ramp.position.set(0, 1.5, -40);
    ramp.rotation.x = 0.25;
    scene.add(ramp);

    // 5. Player Vehicle (Bike / Car Mesh Group)
    const vehicle = new THREE.Group();
    scene.add(vehicle);

    function buildVehicle(type) {
      while (vehicle.children.length > 0) vehicle.remove(vehicle.children[0]);

      if (type === 'bike') {
        // Bike Body
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.8, 2.4),
          new THREE.MeshLambertMaterial({ color: 0xff0000 })
        );
        body.position.y = 0.9;
        vehicle.add(body);

        // Rider
        const rider = new THREE.Mesh(
          new THREE.BoxGeometry(0.6, 1.1, 0.6),
          new THREE.MeshLambertMaterial({ color: 0x111111 })
        );
        rider.position.set(0, 1.7, -0.1);
        vehicle.add(rider);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 16);
        const wheelMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const fWheel = new THREE.Mesh(wheelGeo, wheelMat);
        fWheel.rotation.z = Math.PI / 2;
        fWheel.position.set(0, 0.45, 1.0);
        const bWheel = fWheel.clone();
        bWheel.position.set(0, 0.45, -1.0);
        vehicle.add(fWheel, bWheel);

        document.getElementById('vehName').innerText = "Sports Bike (400)";
      } else if (type === 'car') {
        // SUV / Fortuner Body
        const chassis = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 1.0, 4.4),
          new THREE.MeshLambertMaterial({ color: 0xffffff })
        );
        chassis.position.y = 0.9;
        vehicle.add(chassis);

        const cabin = new THREE.Mesh(
          new THREE.BoxGeometry(1.9, 0.8, 2.5),
          new THREE.MeshLambertMaterial({ color: 0x222222 })
        );
        cabin.position.set(0, 1.7, -0.2);
        vehicle.add(cabin);

        document.getElementById('vehName').innerText = "Fortuner SUV (1000)";
      }
    }

    buildVehicle('bike');

    // 6. Controls & Physics Variables
    let speed = 0;
    let maxSpeed = 1.4;
    let velocityY = 0;
    let isGrounded = true;
    const keys = { w: false, s: false, a: false, d: false };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (keys.hasOwnProperty(k)) keys[k] = false;
    });

    // Touch Button Listeners
    function bindTouch(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      btn.addEventListener('mousedown', () => keys[key] = true);
      btn.addEventListener('mouseup', () => keys[key] = false);
    }
    bindTouch('gasBtn', 'w');
    bindTouch('brakeBtn', 's');
    bindTouch('leftBtn', 'a');
    bindTouch('rightBtn', 'd');

    // 7. Cheat Phone Logic
    const phoneUI = document.getElementById('phoneUI');
    const cheatInput = document.getElementById('cheatInput');

    document.getElementById('phoneBtn').onclick = togglePhone;
    function togglePhone() {
      phoneUI.style.display = phoneUI.style.display === 'block' ? 'none' : 'block';
    }
    function addNum(n) {
      if (cheatInput.value.length < 5) cheatInput.value += n;
    }
    function clearNum() { cheatInput.value = ''; }

    function applyCheat() {
      const code = cheatInput.value;
      if (code === '400') {
        buildVehicle('bike');
        maxSpeed = 1.6;
      } else if (code === '1000') {
        buildVehicle('car');
        maxSpeed = 1.3;
      } else if (code === '9999') {
        if (isGrounded) { velocityY = 0.6; isGrounded = false; }
      } else if (code === '1111') {
        scene.background = new THREE.Color(0x0b0c10);
        scene.fog.color = new THREE.Color(0x0b0c10);
        ambientLight.intensity = 0.25;
      } else {
        alert("Invalid Cheat Code! Try 400, 1000, 9999, 1111");
      }
      clearNum();
      togglePhone();
    }

    // 8. Main Game Loop
    function animate() {
      requestAnimationFrame(animate);

      // Acceleration & Braking
      if (keys.w) speed = Math.min(speed + 0.025, maxSpeed);
      else if (keys.s) speed = Math.max(speed - 0.03, -0.5);
      else speed *= 0.96; // Friction

      // Steering
      if (Math.abs(speed) > 0.02) {
        const dir = speed > 0 ? 1 : -1;
        if (keys.a) vehicle.rotation.y += 0.045 * dir;
        if (keys.d) vehicle.rotation.y -= 0.045 * dir;
      }

      // Move Forward
      vehicle.position.x += Math.sin(vehicle.rotation.y) * speed;
      vehicle.position.z += Math.cos(vehicle.rotation.y) * speed;

      // Jump & Gravity
      vehicle.position.y += velocityY;
      if (vehicle.position.y > 0) {
        velocityY -= 0.025;
      } else {
        vehicle.position.y = 0;
        velocityY = 0;
        isGrounded = true;
      }

      // Speedometer Update
      document.getElementById('spd').innerText = Math.round(Math.abs(speed) * 140);

      // Third-Person Follow Camera
      const camOffset = new THREE.Vector3(0, 4.5, -9).applyMatrix4(vehicle.matrixWorld);
      camera.position.lerp(camOffset, 0.12);
      camera.lookAt(vehicle.position.x, vehicle.position.y + 1.5, vehicle.position.z);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
